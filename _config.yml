# Site settings — available in templates as site.<key>
title: Dane Wesolko
description: "Product designer and graphic designer. Eight years in print, ten in software: energy, pharma, cybersecurity and enterprise SaaS, plus brands and book covers."
lang: en
locale: en_US

# Canonical address. The site is served by GitHub Pages at this address;
# danewesolko.com forwards here via GoDaddy, so there is no CNAME file.
# Don't add one — GitHub would redirect back to the domain and loop.
url: "https://danewesolko7.github.io"
baseurl: ""

# Default share image (1200×630) for pages that don't set `image:`.
image: /assets/img/og/home.png

# Who the site is about — used in structured data (JSON-LD) and the footer.
person:
  name: Dane Wesolko
  job_title: Product Designer and Graphic Designer
  email: danewesolko@gmail.com
  alumni_of: The Art Institute of Fort Lauderdale
  knows_about:
    - Product design
    - User experience (UX) design
    - AI product design
    - Enterprise SaaS
    - Design leadership
    - Graphic design
    - Editorial and magazine design
    - Cover illustration
    - Brand identity
    - Print design and advertising
    - Book cover design
    - Art direction
  same_as:
    - "https://www.linkedin.com/in/dane-michael-wesolko/"
    - "https://brains42069.substack.com/"

# Shortcuts used by templates
email: danewesolko@gmail.com
linkedin: "https://www.linkedin.com/in/dane-michael-wesolko/"

# Search engine verification — paste the content="" value from each tool.
verification:
  google: ""   # Google Search Console → HTML tag method
  bing: ""     # Bing Webmaster Tools → meta tag method

# Analytics — Google Analytics snippet lives in _includes/analytics.html.
analytics: true

# New pages get clean URLs (/about/ instead of /about.html).
# Existing pages pin their own permalink so old links keep working.
permalink: pretty

# No GitHub Pages theme — the site supplies its own layouts and CSS.
theme: null

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEVELOPMENT.md
  - vendor/
  - .bundle/
  - scripts/
  # JPG masters for scripts/make-webp.py and make-og.sh; pages use the .webp files
  - assets/img/covers/*.jpg
  - assets/img/graphic/*.jpg
  - assets/img/work/*.jpg
