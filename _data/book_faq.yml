# Book cover design page — FAQ. Rendered on the page and as FAQPage structured data.
- q: "Do I own the cover?"
  a: "Yes. You get full commercial rights to the final design for your book in every format. Stock images are licensed in your name where the license allows."
- q: "How do payments work?"
  a: "50% deposit to book your slot, 50% on approval of final files."
- q: "What do you need from me?"
  a: "Title, author name, genre, a short synopsis, three to five comparable titles, and for print, your trim size and page count."
- q: "Do you use AI-generated art?"
  a: "Rarely. Covers are built from licensed photography, illustration and original type work. If AI imagery is the right tool for a specific concept, I'll tell you up front and we'll decide together, so you always know what's on your cover and that it's cleared for commercial use."
- q: "Do you work with publishers?"
  a: "Yes. Small and mid-size presses can book single titles or a monthly block at a per-title rate."
