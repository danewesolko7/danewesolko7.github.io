- q: "Do you work in print and on the web?"
  a: "Both. I've designed websites, web ads, and print."
- q: "Can you recreate a design from a printed copy?"
  a: "Yes. The Brazilian Court mailer was rebuilt from an actual printed proof, with a new insert pocket and editable files."
- q: "Do you illustrate?"
  a: "Yes. My October 2012 Counselor cover illustration won an ASHPE Bronze."
- q: "Can you take over an ongoing publication?"
  a: "Yes. I took over layout and design for every issue of Renew in 2014."
- q: "Do you do book covers?"
  a: "Yes. Published covers across self-help, memoir, relationships, cookbooks, and reference."
