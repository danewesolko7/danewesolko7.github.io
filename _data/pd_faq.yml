# Product design page — FAQ. Rendered on the page and as FAQPage structured data.
- q: "Do you write code?"
  a: "Yes. I build HTML, CSS, and JavaScript prototypes, and I've shipped front-end work."
- q: "Can you work in regulated industries?"
  a: "Yes. Nuclear operations at FPL, regulated European health data at IQVIA, pharma field teams for Pfizer, and payments at Spreedly."
- q: "Do you design AI features?"
  a: "Yes. An AI-assisted nuclear screening workflow at FPL, an AI-driven cyber decision-support platform at Mercator Digital, and generative AI tools at Cision."
- q: "What if there's no budget for testing?"
  a: "Even a small round helps. At IQVIA, one round of testing found five problems before we had invested further."
- q: "Which tools do you use?"
  a: "Figma and Figma Make, coded prototypes in HTML, CSS, and JavaScript, and generative tools. Sketches by hand first."
- q: "How do we start?"
  a: "Send the product, the stage, and the deadline using the form below. I'll reply with next steps and an available start date."
