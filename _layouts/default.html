<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body class="ground-{{ page.ground | default: 'paper' }}{% if page.accent %} accent-{{ page.accent }}{% endif %}">
<a class="skip" href="#main">Skip to content</a>

{%- if page.field %}
<div class="field-{{ page.field }}">
{%- endif %}
{% include topbar.html %}
{% include hero.html %}
{%- if page.field %}
</div>
{%- endif %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}

<script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
{%- for script in page.scripts %}
<script src="{{ '/assets/js/' | append: script | append: '.js' | relative_url }}" defer></script>
{%- endfor %}
</body>
</html>
