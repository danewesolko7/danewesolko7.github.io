<!doctype html>
<!-- Share-card template (1200×630). Rendered by scripts/make-og.sh; not published.
     Matches the site: Helvetica Neue, a 2px rule, label + large tight headline, the page's color.
     Query params:
       theme   paper | dark | red | blue | yellow  (the page's ground or color field)
       crumb   text after the DW mark
       kicker  small uppercase label above the title
       title   headline; *word* renders in the theme's highlight color
       covers  comma-separated files in assets/img/covers/, shown at the right -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;}
  body{
    --bg:#F3F1EC; --fg:#111111; --soft:#595959; --accent:#C4241A; --highlight:#C4241A;
    display:flex;
    gap:48px;
    padding:56px 64px;
    background:var(--bg);
    color:var(--fg);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body[data-theme="dark"]{--bg:#0E0E0E;--fg:#F2F0EA;--soft:#B5B2AB;--accent:#FF5C4D;--highlight:#FF5C4D;}
  body[data-theme="red"]{--bg:#C4241A;--fg:#FFFFFF;--soft:#FFFFFF;--accent:#FFFFFF;--highlight:#FFFFFF;}
  body[data-theme="blue"]{--bg:#0F5FB3;--fg:#FFFFFF;--soft:#FFFFFF;--accent:#FFFFFF;--highlight:#F2C230;}
  body[data-theme="yellow"]{--bg:#F2C230;--fg:#111111;--soft:#111111;--accent:#111111;--highlight:#111111;}

  .text{flex:1;min-width:0;display:flex;flex-direction:column;}
  .mark{font-weight:700;font-size:24px;}
  .mark span{margin-left:6px;font-weight:400;color:var(--soft);}
  .head{margin-top:auto;display:flex;flex-direction:column;gap:20px;}
  .label{
    margin:0;
    font-size:16px;
    font-weight:700;
    line-height:1.4;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .kicker{color:var(--accent);}
  h1{margin:0;font-size:80px;font-weight:700;line-height:0.95;letter-spacing:-0.045em;}
  h1 em{font-style:normal;color:var(--highlight);}
  body.has-covers h1{font-size:68px;}
  .foot{margin-top:40px;border-top:2px solid var(--fg);padding-top:14px;}

  .covers{flex:none;align-self:center;display:grid;grid-template-columns:repeat(3,128px);gap:10px;}
  .covers img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
  .covers[hidden]{display:none;}
</style>
</head>
<body>
  <div class="text">
    <div class="mark" id="mark">DW</div>
    <div class="head">
      <p class="label kicker" id="kicker"></p>
      <h1 id="title"></h1>
    </div>
    <p class="label foot">danewesolko.com</p>
  </div>
  <div class="covers" id="covers" hidden></div>
<script>
  var q = new URLSearchParams(location.search);
  document.body.dataset.theme = q.get('theme') || 'paper';
  document.getElementById('kicker').textContent = q.get('kicker') || '';
  // *word* in the title renders in the highlight color
  document.getElementById('title').innerHTML = (q.get('title') || '')
    .replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; })
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
  if(q.get('crumb')) document.getElementById('mark').innerHTML = 'DW<span>/ ' + q.get('crumb') + '</span>';
  var covers = (q.get('covers') || '').split(',').filter(Boolean);
  if(covers.length){
    var box = document.getElementById('covers');
    box.hidden = false;
    document.body.classList.add('has-covers');
    covers.forEach(function(f){
      var img = document.createElement('img');
      img.src = '../assets/img/covers/' + f;
      img.alt = '';
      box.appendChild(img);
    });
  }
</script>
</body>
</html>
